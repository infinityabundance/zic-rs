# Fixture provenance.
#
# Every checked-in expected output records exactly how it was produced, so a reviewer can
# regenerate and trust it. We never check in an opaque binary blob without this record.
#
# Reference toolchain for ALL expected blobs in this file:
#   reference zic : tzcode 2026b   (`zic --version` => "zic (tzcode) 2026b")
#   tzdata source : hand-written minimal fixtures (see below); pinned IANA slices arrive
#                   in milestone T4, extracted from /usr/share/zoneinfo/tzdata.zi (2026b).
#   zic invocation: zic -d <out> <source.zi>     (slim default; no -b fat, no -L)

[[fixture]]
name = "Etc/UTC"
source = "minimal/utc.zi"
expected = "expected/Etc_UTC.tzif"
zic_command = "zic -d <out> fixtures/minimal/utc.zi"
expected_behavior = "Constant UT offset 0, abbreviation UTC, POSIX footer UTC0, no transitions."
parity = "byte-identical"     # our output equals reference zic byte-for-byte
known_differences = "none"

[[fixture]]
name = "UTC"
source = "minimal/utc.zi"     # Link Etc/UTC UTC
expected_behavior = "Link alias of Etc/UTC; materialised by copy (default link mode)."
parity = "semantic"
known_differences = "Link representation (copy vs symlink) is a local choice; target content matches."

[[fixture]]
name = "Test/Fixed"
source = "minimal/fixed.zi"
expected = "expected/Test_Fixed.tzif"
zic_command = "zic -d <out> fixtures/minimal/fixed.zi"
expected_behavior = "Constant UT offset -5:00 (-18000s), abbreviation EST, POSIX footer EST5, no transitions."
parity = "byte-identical"
known_differences = "none"

# --- T2: finite rule-driven DST zones. Parity is SEMANTIC (zdump), not byte: zic's
# local-time-type and abbreviation-table ordering differ from ours while the meaning is
# identical, so we deliberately do not pin byte blobs for these.

[[fixture]]
name = "Test/Simple"
source = "minimal/dst.zi"
zic_command = "zic -d <out> fixtures/minimal/dst.zi ; zdump -v <out>/Test/Simple"
expected_behavior = "US-style finite DST in 2020: spring 2020-03-08 07:00Z -> EDT (-14400), fall 2020-11-01 06:00Z -> EST (-18000); footer EST5."
parity = "semantic"
known_differences = "Type/designation ordering differs from zic; zdump output identical."

[[fixture]]
name = "Test/Euro"
source = "minimal/euro.zi"
zic_command = "zic -d <out> fixtures/minimal/euro.zi ; zdump -v <out>/Test/Euro"
expected_behavior = "EU-style finite DST in 2021 with lastSun and UT-referenced AT (1:00u): CET (+3600) / CEST (+7200); footer CET-1."
parity = "semantic"
known_differences = "Type/designation ordering differs from zic; zdump output identical."

[[fixture]]
name = "Test/Sle"
source = "minimal/sle.zi"
zic_command = "zic -d <out> fixtures/minimal/sle.zi ; zdump -v -c 2019,2022 <out>/Test/Sle"
expected_behavior = "Finite DST in 2015 with Sun<=25 and standard-time AT (2:00s): STDOFF -3:00, summer -7:00 (-7200); footer fixed."
parity = "zdump-behaviour (2019..2022)"
known_differences = "Type/designation ordering differs from zic; zdump output identical."

# --- T3: recurring (TO = maximum) DST zone. Verified by the zdump behaviour oracle over a
# WIDE horizon so the recurring POSIX footer (not just explicit transitions) is exercised.

[[fixture]]
name = "Test/Eastern"
source = "minimal/eastern.zi"
zic_command = "zic -d <out> fixtures/minimal/eastern.zi ; zdump -v -c 2019,2099 <out>/Test/Eastern"
expected_behavior = "US-Eastern-style recurring DST (2007..max): footer EST5EDT,M3.2.0,M11.1.0; spring 2nd Sun Mar, fall 1st Sun Nov, EST/EDT."
parity = "zdump-behaviour (2019..2099)"
known_differences = "Explicit-transition horizon and type ordering differ from zic; zdump behaviour identical across the horizon."

# --- T3.2c: multi-era final era classified by EFFECTIVE in-era activations. The rule set is
# mixed by raw membership but its finite rows fall before the final era starts, so in the
# final era it is effectively recurring-only (the Europe/London shape, in miniature).

[[fixture]]
name = "Test/FinalEffective"
source = "minimal/final_effective.zi"
zic_command = "zic -d <out> fixtures/minimal/final_effective.zi ; zdump -v -c 1990,2040 <out>/Test/FinalEffective"
expected_behavior = "Final era (from 1996) references a finite+recurring rule set whose finite rows end in 1995; effective in-era set is recurring-only -> anchor at 1996 + footer GMT0BST,M3.5.0/1,M10.5.0."
parity = "zdump-behaviour (1990..2040), byte-identical for this fixture"
known_differences = "none observed for this fixture; behaviour is the binding contract."

# --- T3.2a: obsolete `FROM = minimum`, coerced to 1900 exactly as reference `zic`.

[[fixture]]
name = "Test/MinRule"
source = "minimal/minrule.zi"
zic_command = "zic -d <out> fixtures/minimal/minrule.zi ; zdump -v -c 1899,1910 <out>/Test/MinRule"
expected_behavior = "FROM=minimum coerced to 1900 (reference zic warns 'obsolete; treated as 1900'); first transition 1900-04-29 07:00Z; recurring footer EST5EDT,M4.5.0,M10.5.0."
parity = "zdump-behaviour (1899..1910 and 2019..2040)"
known_differences = "Explicit-transition representation (slim/fat) differs from zic; zdump behaviour identical. Reference zic also emits a non-fatal 'minimum obsolete' warning that zic-rs does not yet surface (no compile-warning sink)."

# --- "%z unlock": a `%z` FORMAT on a no-rules era renders the numeric standard offset.

[[fixture]]
name = "Test/PZSolo"
source = "minimal/percent_z_norules.zi"
zic_command = "zic -d <out> fixtures/minimal/percent_z_norules.zi ; zdump -v -c 1900,2010 <out>/Test/PZSolo"
expected_behavior = "No-rules era 0:30 - %z -> one fixed type utoff=1800, is_dst=0, abbr +0030; footer <+0030>-0:30. (ttinfo matches reference zic.)"
parity = "zdump-behaviour (1900..2010), byte-identical"
known_differences = "none; %s and STD/DST slash on a no-rules era stay fail-closed."

