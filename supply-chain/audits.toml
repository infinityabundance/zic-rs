[[audits.semver]]
who = "zic-rs maintainer (full-source review, T23.cargo-vet.6)"
criteria = "safe-to-deploy"
version = "1.0.28"
notes = '''Full source review. Semantic-version parser/comparator. Features in use: NONE beyond default `std` (no `serde`); no build.rs, no proc-macro, no FFI, no network/fs/env; crate-wide `#![deny(unsafe_op_in_unsafe_fn)]` (every unsafe op is in an explicit unsafe block with a SAFETY comment). 49 unsafe sites; lib.rs has ZERO (the one grep hit is the `deny(unsafe_op_in_unsafe_fn)` lint attribute). identifier.rs (43): the bit-tagged short-string `Identifier` (dtolnay's well-documented pointer-tag SSO). INVARIANT: the 8-byte repr distinguishes inline (positive i64: 1-8 nonzero ASCII bytes + \0 padding), heap (negative i64: MSB rotated in; heap ptrs are align-2 so the freed LSB carries the rotated-out bit), and empty (all-ones, -1; also the niche so size_of::<Version>()==size_of::<Option<Version>>()). Reviewed categories: pointer<->repr tagging (`ptr_to_repr`/`repr_to_ptr` use the provenance-correct `wrapping_add(diff)` idiom; NonNull nonzero because MSB is set); owned heap alloc/dealloc (`new_unchecked`/`Clone`/`Drop` use a matching `Layout::from_size_align_unchecked(size, align=2)`; 16/32-bit `isize::MAX` overflow guard present); base-128 varint length header (`decode_len`/`bytes_for_varint`, bounded reads documented as 'at least 9 ASCII bytes follow'); inline reads (`inline_len`/`inline_as_str` aligned `NonZeroU64` read; `str::from_utf8_unchecked` sound because contents are ASCII by the `new_unchecked` precondition); `transmute([u8;8] -> Identifier)` for inline (head nonzero since >=1 ASCII byte). `unsafe impl Send/Sync for Identifier`: sound — it is an OWNED buffer (inline bytes or a uniquely-owned heap allocation), no interior mutability, no shared ownership. parse.rs (5): `Identifier::new_unchecked(string)` x2 — precondition (ASCII, no \0) is enforced by the `identifier()` lexer which only accepts `[-.0-9A-Za-z]`; `out.as_mut_ptr().add(depth).write(comparator)` x2 + `comparators.set_len(len)` — the standard reserve-then-write-each-index-exactly-once idiom (`reserve_exact` precedes the writes; the recursion writes one comparator per depth and returns the exact final count passed to `set_len`). The `new_unchecked` SAFETY contract ('string must be ASCII and not contain \0') is the one caller-upheld invariant; verified the only callers are the two ASCII-validated parse paths. CALL CONTEXT: `semver` is reachable ONLY on WASI targets (zic-rs -> tempfile -> getrandom -> wasip3 -> wit-bindgen -> wit-parser -> semver); it is NEVER compiled in zic-rs's actual (non-WASI) builds — `cargo tree -i semver` on the host is empty. Reviewed each site; sound.'''

[[audits.thiserror]]
