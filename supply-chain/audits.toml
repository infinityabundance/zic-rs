criteria = "safe-to-deploy"
version = "2.0.18"
notes = "Full source review (~466 LoC). A DIRECT zic-rs dependency (the error-derive runtime). ZERO unsafe. Features in use: default. The build.rs is the standard dtolnay capability probe: it emits `cargo:rustc-check-cfg` declarations and compiles a tiny `build/probe.rs` with rustc to detect the nightly `error_generic_member_access` feature, writing only to OUT_DIR — no network, no writes outside OUT_DIR, no env mutation. The crate is a thin `Error`/`Display` runtime; the derive lives in thiserror-impl. Reviewed; sound."

