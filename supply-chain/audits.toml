
# cargo-vet audits file

[[audits.anstream]]
who = "zic-rs maintainer (full-source review, T23.cargo-vet.8)"
criteria = "safe-to-deploy"
version = "1.0.0"
notes = "Full source review (~2562 LoC). Auto-stripping/auto-converting stdout/stderr stream wrapper (the clap colour stack). Features in use: default. **Only 3 unsafe sites, all one pattern** in `adapter/strip.rs`: a private `unsafe fn from_utf8_unchecked(bytes, justification)` that — crucially — calls the **checked** `std::str::from_utf8(bytes).expect(justification)` under `cfg!(debug_assertions)` and only `from_utf8_unchecked` in release; its sole caller passes `printable`, a slice split from already-UTF-8-validated input at a position that stops exactly at the first non-(printable|UTF-8-continuation) byte, so the slice is a whole-codepoint UTF-8 prefix (SAFETY note matches the code; tests + debug-mode checked path would catch any violation). No build.rs, no proc-macro, no network; I/O is only writing to the caller's stdout/stderr stream. Deps (anstyle/anstyle-parse/colorchoice/is_terminal_polyfill, + utf8parse) separately reviewed/exempted. Reviewed each site; sound."

