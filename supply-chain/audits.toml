[[audits.anstyle-parse]]
who = "zic-rs maintainer (full-source review, T23.cargo-vet.5)"
criteria = "safe-to-deploy"
version = "1.0.0"
notes = """Full source review (~1378 LoC). ANSI/VTE escape-sequence state machine. Features in use: default = ["utf8"] (pulls `utf8parse` + `arrayvec`, separately vetted; this audit is of anstyle-parse's own code). 3 unsafe sites, each reviewed + VERIFIED: (1) `[MaybeUninit<&[u8]>; MAX_OSC_PARAMS] = MaybeUninit::uninit().assume_init()` — sound (array-of-MaybeUninit is valid uninitialized); only the first `osc_num_params` elements are initialized, and only `slices[..num_params]` is read back; `osc_num_params` is capped at `MAX_OSC_PARAMS=16` (parser returns/stops at the cap), so the read region == the initialized region. (2)+(3) `mem::transmute::<u8,State>(delta & 0x0f)` / `transmute::<u8,Action>(delta >> 4)` — sound: I COUNTED the enums — State and Action each have EXACTLY 16 `#[repr(u8)]` tag-only variants (discriminants 0..15), and the operands are masked into 0..15, so every transmute targets a valid discriminant; the `delta` bytes come from a const-generated transition table that only packs valid (state,action) pairs. No build.rs, no proc-macro, no FFI, no network/fs/env. Reviewed each site; sound (relies on the documented 16-variant invariant, which I verified holds in this version)."""

[[audits.anstyle-query]]
who = "zic-rs maintainer (full-source review, T23.cargo-vet.5)"
criteria = "safe-to-deploy"
version = "1.1.5"
notes = "Full source review (~242 LoC). Terminal colour-support query. Features in use: default. 1 unsafe site, and it is PLATFORM-SENSITIVE: it lives entirely in `windows.rs` behind `#[cfg(windows)]` and calls the Win32 FFI `GetConsoleMode`/`SetConsoleMode` (with a null-handle check + `last_os_error` handling) to enable ANSI VT processing. NOTE: `SetConsoleMode` *mutates* the Windows console mode — a standard, documented terminal-VT-enable, but a real side effect; it is **never compiled on non-Windows targets** (zic-rs's Unix targets do not build it). The portable path only READS colour-detection env vars (`CLICOLOR`/`CLICOLOR_FORCE`/`NO_COLOR`/`TERM`) — read-only, no fs/net. Deps: `windows-sys` under `cfg(windows)` only (separately exempted). No build.rs, no proc-macro. Admitted with the explicit Windows-FFI/console-mutation note."

[[audits.anstyle-wincon]]
who = "zic-rs maintainer (full-source review, T23.cargo-vet.8)"
criteria = "safe-to-deploy"
version = "3.0.11"
notes = "Full source review (~473 LoC). Windows-console colour attribute application for the anstyle stack. 2 unsafe sites, both PLATFORM-SENSITIVE in `windows.rs` behind `#[cfg(windows)]`: `get_screen_buffer_info` (Win32 `GetConsoleScreenBufferInfo`) and `set_console_text_attributes` (Win32 `SetConsoleTextAttribute`). Each null-checks the handle first, uses `std::mem::zeroed()` on `CONSOLE_SCREEN_BUFFER_INFO` (a plain-integer C struct — validly zeroable), calls the FFI, and maps a non-success return to `last_os_error()`. `SetConsoleTextAttribute` *mutates* the console text attributes — a documented, standard terminal-colour side effect, but a real one; it is **never compiled on zic-rs's non-Windows targets**. The portable path is pure colour-attribute math, no fs/net. Dep `windows-sys` under `cfg(windows)` only (separately exempted). No build.rs, no proc-macro. Admitted with the explicit Windows-FFI/console-mutation note."

