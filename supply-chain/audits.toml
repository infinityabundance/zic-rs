[[audits.errno]]
who = "zic-rs maintainer (full-source review, T23.cargo-vet.8)"
criteria = "safe-to-deploy"
version = "0.3.14"
notes = "Full source review (~472 LoC across unix/wasi/windows/hermit/lib). Cross-platform `errno` accessor (reached via rustix/tempfile on some targets). 12 unsafe sites, every one a standard, bounded pattern: (1) `from_utf8_lossy` → `str::from_utf8_unchecked(&input[..error.valid_up_to()])` — the prefix is proven-valid UTF-8 by `valid_up_to()`; (2) `with_description` → `strerror_r` into a fixed 1024-byte STACK buffer, then `strlen` to find the NUL-terminated length and slice `&buf[..len]` (POSIX guarantees NUL-termination within the buffer when rc==0; ERANGE/negative-rc handled for glibc<2.13) — bounded by the stack buffer; (3) `errno()`/`set_errno()` → deref the libc thread-local errno pointer (`__errno_location`/`errno_location`/`GetLastError`/`SetLastError`); the wasi/windows arms are the analogous thread-local + FFI forms. No build.rs, no proc-macro, no network/fs; the only effect is reading/writing the thread-local C errno and formatting its message. Dep `libc` (separately exempted). Reviewed each site; sound."

