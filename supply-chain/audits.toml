[[audits.itoa]]
who = "zic-rs maintainer (full-source review, T23.cargo-vet.5)"
criteria = "safe-to-deploy"
version = "1.0.18"
notes = "Full source review (~488 LoC, lib.rs + u128_ext.rs). Integer->decimal-string formatter. Features in use: NONE (default; the optional `no-panic` feature is a build-time #[no_panic] check, not enabled). 13 unsafe sites, ALL one reviewed pattern: write ASCII digit-pairs from the 200-byte `DECIMAL_PAIRS` lookup table (`buf[i].write(*DECIMAL_PAIRS.0.get_unchecked(pair*2+{0,1}))`, pair = n%100 in 0..99 => index 0..199, in-bounds) into a `[MaybeUninit<u8>; MAX_STR_LEN]` stack buffer sized for the integer type, then read the initialized tail back via `slice_buffer_to_str` (`get_unchecked(offset..)` with offset = len - digits >= 0; `from_utf8_unchecked` sound because every written byte is ASCII from the table). `format()` casts the i128-sized buffer to the smaller per-type buffer (fits); `hint::unreachable_unchecked()` guards the encoder's own length invariant (string.len() <= type MAX_STR_LEN, true by construction). Call context: input is ALWAYS a primitive integer, never hostile bytes. No build.rs, no proc-macro, no FFI, no network/fs/env. no_std. Reviewed each site; sound."

[[audits.log]]
who = "zic-rs maintainer (full-source review, T23.cargo-vet.6)"
criteria = "safe-to-deploy"
version = "0.4.30"
notes = """Full source review of the logging FACADE (src/lib.rs + small modules). Features in use: NONE beyond default `std` (no `kv`/`serde`/`value-bag`); no build.rs, no proc-macro, no FFI, no network/fs/env. 8 unsafe sites, all reviewed: (1) the GLOBAL LOGGER state machine — a `static LOGGER: &dyn Log` guarded by `STATE: AtomicUsize` (UNINITIALIZED->INITIALIZING->INITIALIZED). `set_logger`/`set_logger_inner` CAS STATE from UNINITIALIZED->INITIALIZING (Acquire/AcqRel); ONLY the CAS winner writes `LOGGER` (`unsafe { LOGGER = make_logger() }`), then stores INITIALIZED (Release). `logger()` reads `unsafe { LOGGER }` ONLY when `STATE == INITIALIZED` (Acquire) — the Release/Acquire pair establishes happens-before, so the read sees the fully-written `&'static dyn Log`. The `'static` bound on `set_logger` guarantees the logger outlives all reads. Sound. (2) `mem::transmute(MAX_LOG_LEVEL_FILTER.load(Relaxed))` usize->LevelFilter: the static is private and only ever written by casting a `LevelFilter` to usize (`set_max_level`), so every stored value is a valid enum discriminant. Sound. (3) The `_racy` variants (`set_logger_racy`/`set_max_level_racy`) are `pub unsafe fn`s exposing a documented thread-unsafe contract for no-atomic platforms; they do nothing memory-unsafe themselves and zic-rs never calls them. (4) `unsafe impl Sync for AtomicUsize` is `#[cfg(not(target_has_atomic = "ptr"))]`-gated to single-core no-atomic targets (a Cell-backed fallback) — not compiled on any real zic-rs target. Concurrency model: a one-shot set + lock-free reads via the STATE atomic. CALL CONTEXT: `log` is reachable ONLY on WASI targets (zic-rs -> tempfile -> getrandom -> wasip3 -> wit-bindgen -> wit-parser/wit-component -> log); it is NEVER compiled in zic-rs's actual (non-WASI) builds — `cargo tree -i log` on the host is empty. Reviewed each site; sound."""

