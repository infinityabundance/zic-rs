# Detached creusot harness — own [workspace] so creusot-std never enters the main crate's
# dep/vet/audit surface (mirrors fuzz/ + the loom/crux harnesses). creusot-std comes from the SAME
# git rev the installed cargo-creusot 0.12.0-dev was built from (already in the cargo cache).
# Run: `cargo creusot` from here.
[workspace]

[package]
name = "zic-rs-creusot-harness"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
creusot-std = "0.12.0-dev"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(creusot)'] }
